name: Apply reviewed fresh router foundation
on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact reviewed main commit SHA (40 lowercase hex characters)
        required: true
        type: string
      confirm_foundation:
        description: Create closed foundation only; no app activation, firewall or deletion
        required: true
        default: false
        type: boolean
permissions: {}
concurrency:
  group: azure-router-infrastructure
  cancel-in-progress: false
jobs:
  foundation:
    if: github.repository == 'r33drichards/webhook-mcp-router' && github.ref == 'refs/heads/main' && inputs.confirm_foundation == true
    environment: azure-router
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      ARM_CLIENT_ID: ${{ vars.AZURE_ROUTER_CLIENT_ID }}
      ARM_TENANT_ID: 0e4545fd-804f-4acb-ad41-f955e53645c1
      ARM_SUBSCRIPTION_ID: 38d8d92f-3e84-4ef5-b3da-2788a843aa70
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_USE_CLI: 'false'
      ARM_SKIP_PROVIDER_REGISTRATION: 'true'
      TF_IN_AUTOMATION: 'true'
      CHECKPOINT_DISABLE: '1'
      TF_VAR_sql_admin_login: ${{ vars.AZURE_SQL_ADMIN_LOGIN }}
      TF_VAR_sql_admin_object_id: ${{ vars.AZURE_SQL_ADMIN_OBJECT_ID }}
      TF_VAR_runtime_ready: 'false'
      ROUTER_STATE_ACCOUNT: ${{ vars.AZURE_ROUTER_STATE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require reviewed bootstrap and inventory
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          python3 ci/test-azure-fresh-plan-check.py
          test -n "$TF_VAR_sql_admin_login"
          test -n "$TF_VAR_sql_admin_object_id"
          test -n "$ARM_CLIENT_ID"
          test -n "$ROUTER_STATE_ACCOUNT"
          test -f deploy/azure/terraform-fresh/resources.json
      - name: Install checksum-pinned Terraform
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/terraform"
          curl -fsSL --max-time 60 https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip -o "$RUNNER_TEMP/terraform/t.zip"
          printf '%s  %s\n' d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d "$RUNNER_TEMP/terraform/t.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/terraform/t.zip" -d "$RUNNER_TEMP/terraform"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"
      - name: Validate and guard private foundation plan
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd deploy/azure/terraform-fresh
          terraform init -input=false -lockfile=readonly \
            -backend-config="storage_account_name=$ROUTER_STATE_ACCOUNT" \
            -backend-config=container_name=tfstate \
            -backend-config=key=router-v2.tfstate > "$RUNNER_TEMP/tf-init.log" 2>&1
          terraform validate -no-color
          terraform plan -input=false -lock-timeout=60s -out="$RUNNER_TEMP/router.tfplan" > "$RUNNER_TEMP/tf-plan.log" 2>&1
          terraform show -json "$RUNNER_TEMP/router.tfplan" > "$RUNNER_TEMP/router-plan.json"
          python ../../../ci/azure-fresh-plan-check.py "$RUNNER_TEMP/router-plan.json" --foundation-only
          sha256sum "$RUNNER_TEMP/router.tfplan" > "$RUNNER_TEMP/router-plan.sha256"
          # This checksum detects local plan changes; it is not independent human plan approval.
      - name: Apply the exact guarded plan and verify closed desired state
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sha256sum --check --status "$RUNNER_TEMP/router-plan.sha256"
          cd deploy/azure/terraform-fresh
          terraform apply -input=false -lock-timeout=60s "$RUNNER_TEMP/router.tfplan" > "$RUNNER_TEMP/tf-apply.log" 2>&1
          terraform plan -input=false -lock-timeout=60s -out="$RUNNER_TEMP/router-post.tfplan" > "$RUNNER_TEMP/tf-post.log" 2>&1
          terraform show -json "$RUNNER_TEMP/router-post.tfplan" > "$RUNNER_TEMP/router-post.json"
          python ../../../ci/azure-fresh-plan-check.py "$RUNNER_TEMP/router-post.json" --foundation-only --require-noop
          # No state, raw plan or log uploads. Failed/partial apply is never auto-destroyed.
      - name: Remove private plan and logs
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/router.tfplan" "$RUNNER_TEMP/router-plan.json" "$RUNNER_TEMP/tf-init.log" "$RUNNER_TEMP/tf-plan.log" "$RUNNER_TEMP/router-plan.sha256" "$RUNNER_TEMP/tf-apply.log" "$RUNNER_TEMP/tf-post.log" "$RUNNER_TEMP/router-post.tfplan" "$RUNNER_TEMP/router-post.json"
          rm -rf -- deploy/azure/terraform-fresh/.terraform
