name: Plan fresh closed Azure router
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: azure-router-infrastructure
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'r33drichards/webhook-mcp-router' && github.ref == 'refs/heads/main'
    environment: azure-router
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_ROUTER_CLIENT_ID }}
      ARM_TENANT_ID: 0e4545fd-804f-4acb-ad41-f955e53645c1
      ARM_SUBSCRIPTION_ID: 38d8d92f-3e84-4ef5-b3da-2788a843aa70
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_USE_CLI: 'false'
      ARM_SKIP_PROVIDER_REGISTRATION: 'true'
      TF_IN_AUTOMATION: 'true'
      CHECKPOINT_DISABLE: '1'
      TF_VAR_sql_admin_login: ${{ vars.AZURE_SQL_ADMIN_LOGIN }}
      TF_VAR_sql_admin_object_id: ${{ vars.AZURE_SQL_ADMIN_OBJECT_ID }}
      TF_VAR_runtime_ready: 'false'
      ROUTER_STATE_ACCOUNT: ${{ vars.AZURE_ROUTER_STATE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require reviewed bootstrap and inventory
        run: |
          test -n "$TF_VAR_sql_admin_login"
          test -n "$TF_VAR_sql_admin_object_id"
          test -n "$ARM_CLIENT_ID"
          test -n "$ROUTER_STATE_ACCOUNT"
          test -f deploy/azure/terraform-fresh/resources.json
      - name: Install checksum-pinned Terraform
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/terraform"
          curl -fsSL --max-time 60 https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip -o "$RUNNER_TEMP/terraform/t.zip"
          printf '%s  %s\n' d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d "$RUNNER_TEMP/terraform/t.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/terraform/t.zip" -d "$RUNNER_TEMP/terraform"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"
      - name: Validate and guard private adoption plan
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd deploy/azure/terraform-fresh
          terraform init -input=false -lockfile=readonly \
            -backend-config="storage_account_name=$ROUTER_STATE_ACCOUNT" \
            -backend-config=container_name=tfstate \
            -backend-config=key=router-v2.tfstate > "$RUNNER_TEMP/tf-init.log" 2>&1
          terraform validate -no-color
          terraform plan -input=false -lock-timeout=60s -out="$RUNNER_TEMP/router.tfplan" > "$RUNNER_TEMP/tf-plan.log" 2>&1
          terraform show -json "$RUNNER_TEMP/router.tfplan" > "$RUNNER_TEMP/router-plan.json"
          python ../../../ci/azure-fresh-plan-check.py "$RUNNER_TEMP/router-plan.json"
          # No apply. Saved plan/state/logs are never uploaded or printed.
      - name: Remove private plan and logs
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/router.tfplan" "$RUNNER_TEMP/router-plan.json" "$RUNNER_TEMP/tf-init.log" "$RUNNER_TEMP/tf-plan.log"
          rm -rf -- deploy/azure/terraform-fresh/.terraform
