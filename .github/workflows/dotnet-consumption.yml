name: CSharp Consumption readiness
on:
  push:
    paths:
      - 'src/dotnet/**'
      - 'tests/dotnet/**'
      - 'policies/capabilities.json'
      - '.github/workflows/dotnet-consumption.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.402'
      - name: Fetch official pinned OPA and verify digest
        shell: pwsh
        run: |
          $opaPath = Join-Path $env:RUNNER_TEMP 'opa.exe'
          Invoke-WebRequest 'https://github.com/open-policy-agent/opa/releases/download/v1.9.0/opa_windows_amd64.exe' -OutFile $opaPath
          if ((Get-FileHash $opaPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ea07eb413f7d0b258dc2e45d054ebb7df6fad42ad436bbe96e5dc6d5e7bc2951') { throw 'OPA digest mismatch' }
          & $opaPath version
          if ($LASTEXITCODE -ne 0) { throw 'OPA version failed' }
      - name: Test real OPA process and usage thresholds
        shell: pwsh
        run: |
          dotnet run --project tests/dotnet/Router.Checks --configuration Release -- (Join-Path $env:RUNNER_TEMP 'opa.exe') (Join-Path $env:GITHUB_WORKSPACE 'policies/capabilities.json')
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
      - name: Test OAuth validation and tenant mapping
        shell: pwsh
        run: |
          dotnet run --project tests/dotnet/Router.AuthChecks --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Auth checks failed' }
      - name: Test SQL tenant boundaries and request logs
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB start failed' }
          dotnet run --project tests/dotnet/Router.Integration --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'SQL checks failed' }
      - name: Test official SDK stateless tools and events
        shell: pwsh
        run: |
          dotnet run --project tests/dotnet/Router.McpChecks --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'MCP SDK checks failed' }
      - name: Test authenticated HTTP handlers with synthetic fixtures
        shell: pwsh
        run: |
          dotnet run --project tests/dotnet/Router.HttpChecks --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'HTTP handler checks failed' }
      - name: Build isolated Functions MCP project
        shell: pwsh
        run: |
          dotnet build src/dotnet/Router.Functions --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Functions build failed' }
      - name: Build actual-host synthetic issuer fixture
        shell: pwsh
        run: |
          dotnet build tests/dotnet/Router.HostFixture --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Host fixture build failed' }
      - name: Install pinned official Core Tools and local Azurite
        shell: pwsh
        run: |
          $toolsPath = Join-Path $env:RUNNER_TEMP 'functions-host-tools'
          npm install --prefix $toolsPath azure-functions-core-tools@4.12.0 azurite@3.35.0 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Official host tooling install failed; no alternate download attempted' }
          & (Join-Path $toolsPath 'node_modules/azure-functions-core-tools/bin/func.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Core Tools version failed' }
      - name: Boot actual Functions host and verify routes
        shell: pwsh
        run: |
          $toolsPath = Join-Path $env:RUNNER_TEMP 'functions-host-tools'
          $fixturePath = Join-Path $env:RUNNER_TEMP 'functions-host-fixture'
          New-Item -ItemType Directory -Force $fixturePath | Out-Null
          $azuriteScript = Join-Path $toolsPath 'node_modules/azurite/dist/src/azurite.js'
          $azurite = Start-Process node -ArgumentList @($azuriteScript, '--silent', '--location', $fixturePath, '--blobHost', '127.0.0.1', '--queueHost', '127.0.0.1', '--tableHost', '127.0.0.1') -PassThru -RedirectStandardOutput (Join-Path $fixturePath 'azurite.out') -RedirectStandardError (Join-Path $fixturePath 'azurite.err')
          try {
            python ci/functions-host-check.py --func (Join-Path $toolsPath 'node_modules/azure-functions-core-tools/bin/func.exe') --root src/dotnet/Router.Functions/bin/Release/net10.0 --log-dir $fixturePath
            if ($LASTEXITCODE -ne 0) { throw 'Actual Functions-host checks failed' }
            dotnet run --project tests/dotnet/Router.HostChecks --configuration Release -- (Join-Path $toolsPath 'node_modules/azure-functions-core-tools/bin/func.exe') (Join-Path $env:GITHUB_WORKSPACE 'tests/dotnet/Router.HostFixture/bin/Release/net10.0') (Join-Path $env:RUNNER_TEMP 'opa.exe') (Join-Path $env:GITHUB_WORKSPACE 'policies/capabilities.json')
            if ($LASTEXITCODE -ne 0) { throw 'Authenticated Functions-host SQL checks failed' }
          } finally {
            if (!$azurite.HasExited) { Stop-Process -Id $azurite.Id -Force }
          }
# No Azure login, credentials, billing change, provisioning or deployment.

