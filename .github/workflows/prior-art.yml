name: Existing WASIX Go networking probe
on:
  push:
    paths: ['.github/workflows/prior-art.yml', 'ci/prior-art-check.py', 'ci/install-wasix-go.sh', 'spike/prior-art/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install digest-verified upstream WASIX Go fork
        run: bash ci/install-wasix-go.sh
      - name: Install pinned Wasmer
        run: bash ci/install-wasmer.sh
      - name: Actual socket, verified TLS and HTTPS tests
        run: python3 ci/prior-art-check.py
